name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # Build .env dari GitHub Secrets (AMAN — tidak pernah masuk
      # ke riwayat git, hanya tersedia saat build berjalan)
      # ============================================================

      # Vite TIDAK gagal kalau import.meta.env kosong — dia cuma substituting
      # string kosong. Akibatnya build tetap hijau tapi bundle-nya rusak total
      # (Firebase tidak bisa diinisialisasi, tidak ada user yang bisa login).
      # Karena itu secret dicek dulu, sebelum build jalan.
      - name: Check required VITE secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum diisi di Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Build dibatalkan supaya tidak ter-deploy bundle yang rusak."
            exit 1
          fi

      - name: Create .env from GitHub Secrets
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_GROQ_API_KEY=${{ secrets.VITE_GROQ_API_KEY }}" >> .env
          echo "VITE_OPENROUTER_API_KEY=${{ secrets.VITE_OPENROUTER_API_KEY }}" >> .env
          echo "VITE_TELEGRAM_BOT_TOKEN=${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}" >> .env
          echo "VITE_TELEGRAM_CHAT_ID=${{ secrets.VITE_TELEGRAM_CHAT_ID }}" >> .env

      - name: Build production bundle
        run: npm run build

      # ============================================================
      # Deploy hosting ke Firebase menggunakan token CI
      # (FIREBASE_TOKEN disimpan sebagai GitHub Secret — aman)
      #
      # --project wajib diisi. Tanpa itu, Firebase memakai project default
      # milik token, yang belum tentu proman-83c57, dan deploy bisa
      # diarahkan ke project yang salah.
      # ============================================================

      # Cek secret-nya lebih dulu supaya kalau kosong, pesannya jelas dan
      # bukan "Error: Invalid arguments" yang membingungkan.
      #
      # Secrets tidak otomatis tersedia sebagai variabel env, jadi nilainya
      # harus disalin eksplisit dulu di baris env:.
      - name: Check required secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN belum diisi di Settings > Secrets and variables > Actions."
            echo "::error::Buat token dengan perintah: firebase login:ci"
            exit 1
          fi
          echo "FIREBASE_TOKEN tersedia."

      - name: Diagnose token
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "panjang   : ${#FIREBASE_TOKEN}"
          echo "sha256    : $(printf '%s' "$FIREBASE_TOKEN" | sha256sum | cut -c1-16)"
          echo "ada CR/LF : $(printf '%s' "$FIREBASE_TOKEN" | od -c | grep -c '\\r\\|\\n' || true)"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        # --yes supaya npx tidak menunda install CLI dengan prompt interaktif,
        # yang tidak bisa dijawab di runner GitHub.
        run: npx --yes firebase-tools@latest deploy --only hosting --project proman-83c57 --token "$FIREBASE_TOKEN"

      # ============================================================
      # OPSIONAL: aktifkan baris ini untuk auto-deploy Cloud Functions
      # (butuh secret tambahan unttuk runtime config Gmail di CI)
      # ------------------------------------------------------------
      # - name: Deploy Cloud Functions
      #   run: npx firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}"
      # ============================================================